# 把 Web 的发布地址从 loopback 换成局域网。**必须在改完初始密码之后才叠加**——
# 在那之前 admin/admin 会暴露给同网段。
#
# ``!override`` 而不是直接再写一条端口：Compose 对 ``ports`` 默认是**合并**语义，
# 追加一条只会渲染出 127.0.0.1:8080 与 0.0.0.0:8080 **两条**映射，基础的 loopback
# 映射并没有被换掉。需要 Compose >= 2.24.4。
services:
  web-app:
    ports: !override
      - "0.0.0.0:8080:8080"
