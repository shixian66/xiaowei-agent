x-app-environment: &app-environment
  XIAOWEI_ENVIRONMENT_ID: dev
  XIAOWEI_ACTOR: local-developer
  XIAOWEI_LOG_LEVEL: INFO
  XIAOWEI_POSTGRES_HOST: postgres
  XIAOWEI_POSTGRES_PORT: "5432"
  XIAOWEI_POSTGRES_DATABASE: xiaowei
  XIAOWEI_POSTGRES_USER: xiaowei
  XIAOWEI_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  XIAOWEI_API_BIND_HOST: "0.0.0.0"
  XIAOWEI_API_BIND_PORT: "8000"

x-app-service: &app-service
  image: xiaowei-agent:${COMPOSE_XIAOWEI_IMAGE_TAG:-m5-local}
  build:
    context: .
    dockerfile: Dockerfile
  environment: *app-environment
  secrets:
    - postgres_password
  init: true
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
    environment:
      POSTGRES_DB: xiaowei
      POSTGRES_USER: xiaowei
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "xiaowei", "-d", "xiaowei"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *app-service
    command: ["python", "-m", "xiaowei_agent.interfaces.migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app-service
    command: ["python", "-m", "xiaowei_agent.interfaces.api"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import http.client,sys; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=2); c.request('GET','/healthz'); sys.exit(0 if c.getresponse().status == 200 else 1)"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  worker:
    <<: *app-service
    command: ["python", "-m", "xiaowei_agent.interfaces.worker"]
    # W4a：只挂自己消费的域。worker 读 AI；resources 只预留（W4b 才读取并签回执）。
    volumes:
      - type: bind
        source: ./.config/ai
        target: /run/xiaowei-config/ai
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.config/resources
        target: /run/xiaowei-config/resources
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully

  feishu-listener:
    <<: *app-service
    profiles: ["m7-channels"]
    command: ["python", "-m", "xiaowei_agent.interfaces.feishu_listener"]
    environment:
      <<: *app-environment
      XIAOWEI_FEISHU_LISTENER_ENABLED: "false"
    # W4a：只挂飞书域；看不见 AI 或 resources。
    volumes:
      - type: bind
        source: ./.config/feishu
        target: /run/xiaowei-config/feishu
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully

  channel-worker:
    <<: *app-service
    profiles: ["m7-channels"]
    command: ["python", "-m", "xiaowei_agent.interfaces.feishu_worker"]
    environment:
      <<: *app-environment
      XIAOWEI_CHANNEL_WORKER_ENABLED: "false"
    # W4a：只挂飞书域；看不见 AI 或 resources。
    volumes:
      - type: bind
        source: ./.config/feishu
        target: /run/xiaowei-config/feishu
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully

  # 本里程碑的主入口，**不在 profile 里**：普通 ``docker compose up -d`` 就该拉起
  # 它，否则 runbook 第 5 步永远启动不了 Web。飞书那两个进程仍留在 m7-channels，
  # 因为飞书是可选插件。
  web-app:
    <<: *app-service
    command: ["python", "-m", "xiaowei_agent.interfaces.web_app"]
    environment:
      <<: *app-environment
      # 全部用带默认值的插值：写字面量时 Compose 的 environment 优先级高于 .env，
      # 于是 `.env` 里改这些键**不会生效**，而运维只会以为自己改了。
      # 默认值一律保持关闭，"默认关闭"这条承诺不变。
      XIAOWEI_WEB_APP_ENABLED: "${XIAOWEI_WEB_APP_ENABLED:-false}"
      XIAOWEI_FEISHU_OAUTH_ENABLED: "${XIAOWEI_FEISHU_OAUTH_ENABLED:-false}"
      XIAOWEI_WEB_MODE: "${XIAOWEI_WEB_MODE:-https}"
      XIAOWEI_WEB_PUBLIC_ORIGIN: "${XIAOWEI_WEB_PUBLIC_ORIGIN:-}"
      XIAOWEI_GEMINI_REAL_TEST_ENABLED: "${XIAOWEI_GEMINI_REAL_TEST_ENABLED:-false}"
      XIAOWEI_FEISHU_REAL_TEST_ENABLED: "${XIAOWEI_FEISHU_REAL_TEST_ENABLED:-false}"
      XIAOWEI_WEB_BIND_HOST: "0.0.0.0"
      XIAOWEI_WEB_BIND_PORT: "8080"
    # 唯一配置写者：三个域目录逐个读写挂载，**不挂父目录**——旧 integrations.json
    # 因此对任何运行进程都不可见，只能由显式迁移器处理。
    volumes:
      - type: bind
        source: ./.config/ai
        target: /run/xiaowei-config/ai
        bind:
          create_host_path: false
      - type: bind
        source: ./.config/feishu
        target: /run/xiaowei-config/feishu
        bind:
          create_host_path: false
      - type: bind
        source: ./.config/resources
        target: /run/xiaowei-config/resources
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import http.client,sys; c=http.client.HTTPConnection('127.0.0.1',8080,timeout=2); c.request('GET','/healthz'); sys.exit(0 if c.getresponse().status == 200 else 1)"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

# Provider 凭据不走 Docker secret：它们由管理面写进 ``.config/{ai,feishu}/config.json``，
# 每个域一份明文、一处真源；resources 域在 W4a 只预留目录。这里只剩数据库口令，
# 它是部署前就存在的基础设施凭据。
secrets:
  postgres_password:
    file: ./.secrets/postgres_password

volumes:
  postgres_data:
