x-app-environment: &app-environment
  XIAOWEI_ENVIRONMENT_ID: dev
  XIAOWEI_ACTOR: local-developer
  XIAOWEI_LOG_LEVEL: INFO
  XIAOWEI_POSTGRES_HOST: postgres
  XIAOWEI_POSTGRES_PORT: "5432"
  XIAOWEI_POSTGRES_DATABASE: xiaowei
  XIAOWEI_POSTGRES_USER: xiaowei
  XIAOWEI_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  XIAOWEI_API_BIND_HOST: "0.0.0.0"
  XIAOWEI_API_BIND_PORT: "8000"

x-app-service: &app-service
  image: xiaowei-agent:${COMPOSE_XIAOWEI_IMAGE_TAG:-m5-local}
  build:
    context: .
    dockerfile: Dockerfile
  environment: *app-environment
  secrets:
    - postgres_password
  init: true
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
    environment:
      POSTGRES_DB: xiaowei
      POSTGRES_USER: xiaowei
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "xiaowei", "-d", "xiaowei"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *app-service
    command: ["python", "-m", "xiaowei_agent.interfaces.migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app-service
    command: ["python", "-m", "xiaowei_agent.interfaces.api"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import http.client,sys; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=2); c.request('GET','/healthz'); sys.exit(0 if c.getresponse().status == 200 else 1)"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  worker:
    <<: *app-service
    command: ["python", "-m", "xiaowei_agent.interfaces.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  feishu-listener:
    <<: *app-service
    profiles: ["m7-channels"]
    command: ["python", "-m", "xiaowei_agent.interfaces.feishu_listener"]
    environment:
      <<: *app-environment
      XIAOWEI_FEISHU_LISTENER_ENABLED: "false"
    secrets:
      - postgres_password
      - feishu_app_secret
    volumes:
      - type: bind
        source: ./.secrets/feishu-identities.json
        target: /run/config/feishu-identities.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully

  channel-worker:
    <<: *app-service
    profiles: ["m7-channels"]
    command: ["python", "-m", "xiaowei_agent.interfaces.feishu_worker"]
    environment:
      <<: *app-environment
      XIAOWEI_CHANNEL_WORKER_ENABLED: "false"
    secrets:
      - postgres_password
      - feishu_app_secret
    depends_on:
      migrate:
        condition: service_completed_successfully

  web-app:
    <<: *app-service
    profiles: ["m7-channels"]
    command: ["python", "-m", "xiaowei_agent.interfaces.web_app"]
    environment:
      <<: *app-environment
      XIAOWEI_WEB_APP_ENABLED: "false"
      XIAOWEI_FEISHU_OAUTH_ENABLED: "false"
      XIAOWEI_WEB_BIND_HOST: "0.0.0.0"
      XIAOWEI_WEB_BIND_PORT: "8080"
    secrets:
      - postgres_password
      - feishu_app_secret
    volumes:
      - type: bind
        source: ./.secrets/feishu-identities.json
        target: /run/config/feishu-identities.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import http.client,sys; c=http.client.HTTPConnection('127.0.0.1',8080,timeout=2); c.request('GET','/healthz'); sys.exit(0 if c.getresponse().status == 200 else 1)"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

secrets:
  postgres_password:
    file: ./.secrets/postgres_password
  feishu_app_secret:
    file: ./.secrets/feishu_app_secret

volumes:
  postgres_data:
