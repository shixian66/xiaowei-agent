# gitleaks 配置：在默认规则之上，只加一条**按取值**的极窄豁免。
#
# 背景：脱敏测试有固有张力——要证明脱敏有效，输入必须"看起来像 secret"。
# 本仓库的既有约定是把假字面量拆开写（``"hunter" + "2-plain"``、
# ``"gh" + "p_" + "A" * 36``），使它在源码里从不构成连续可扫描串。M2 有三处
# 写成了连续形式，并已进入提交 0d8d6b4c 与 63d38011。
#
# 为什么用豁免而不是重写历史：这两个提交位于 22 个提交的中段，重写会改写其后
# 全部 SHA，包括独立评审逐轮锚定的 56ef5990。评审锚点的价值高于历史整洁。
#
# 豁免的维度是**取值**，不是文件。这一点是实测定下来的，不是设计偏好：
#
# * 只写 ``paths`` 会把整个文件放行——gitleaks 把 ``paths`` 与 ``regexes`` 按
#   **OR** 处理，同路径下的真实 secret 会被静默漏掉。
# * ``matchCondition = "AND"`` 在 8.30 的顶层 allowlist 里不生效，加上它反而
#   更宽：实测中它把一个随机高熵 secret 也放行了。
# * ``regexes`` 匹配的是 gitleaks **提取出的取值**（此处为 ``abc123def456``），
#   不是整行；因此必须写成锚定形式，否则任何包含它的更长 secret 也会被放行。
#
# 结果：只有这一个确切字符串被当作非 secret，出现在哪个文件都一样；任何其他
# 取值——包括以它为子串的——仍会被拦下。narrowness 由 CI 自测证明，不靠本注释。
[extend]
useDefault = true

[[allowlists]]
description = "已知的伪造脱敏样本取值；只按取值精确豁免，不放行任何文件或路径"
regexes = ['''^abc123def456$''']
