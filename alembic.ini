# Alembic 配置。
#
# **`sqlalchemy.url` 故意留空。** 连接串由调用方在运行时注入（程序化调用传
# `config.set_main_option("sqlalchemy.url", dsn)`，命令行用 `-x dsn=...`）。
# 写进本文件等于把连接串提交进仓库——ADR-007 禁止，`secret-scan` job 也会拦。
#
# env.py **不读 `.env`、不读 `XIAOWEI_*`**：迁移的连接来源与 `load_settings()` 的
# 应用配置来源互相隔离，一边的变更不会静默改变另一边的行为。
[alembic]
script_location = src/xiaowei_agent/persistence/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
