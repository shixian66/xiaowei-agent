# Alembic configuration.
#
# ASCII ONLY -- DO NOT PUT NON-ASCII BYTES IN THIS FILE.
# Alembic reads it with ConfigParser.read(..., encoding="locale")
# (alembic/util/compat.py). "locale" is resolved from the *process* environment,
# not from anything this repo controls, so a non-ASCII byte here makes the file
# undecodable on any machine whose locale encoding is not a superset of it --
# breaking both `python -m pytest -q` and `alembic upgrade head`. There is no
# Alembic option to override that encoding. Rationale in prose lives in
# migrations/env.py, which is a .py file and therefore UTF-8 by PEP 263.
# Enforced by tests/contract/test_config_encoding.py.
#
# `sqlalchemy.url` is deliberately empty. The DSN is injected at run time
# (programmatically via config.set_main_option, or `-x dsn=...` on the CLI).
# Committing a DSN here is forbidden by ADR-007 and would trip the secret-scan job.
[alembic]
script_location = src/xiaowei_agent/persistence/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
